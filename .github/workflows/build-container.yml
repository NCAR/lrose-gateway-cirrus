name: Build single-user image

on:
  push:
    branches: [main]
    paths:
      - 'container/**'
      - '.github/workflows/build-container.yml'
  workflow_dispatch:

env:
  REGISTRY: hub.k8s.ucar.edu
  IMAGE: hub.k8s.ucar.edu/nsflrose/gateway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build LROSE Jupyter image
        uses: docker/build-push-action@v7
        with:
          context: container
          file: container/Dockerfile        
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.date.outputs.date }}

      - name: Summary
        run: |
          {
            echo "### ${IMAGE}:${TAG}"
            echo "Pushed. To deploy, set \`singleuser.image.tag: \"${TAG}\"\` in \`lrose-jhub-values.yaml\` and let ArgoCD sync."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ steps.date.outputs.date }}
