name: Build single-user image

# Builds the JupyterHub single-user image from container/.
#
# Two modes, deliberately separated:
#
#   * push / pull_request touching container/  -> BUILD ONLY, never pushed.
#     This is a correctness check on the Dockerfile. It costs nothing in the
#     registry and catches a broken build before anyone tries to release it.
#
#   * workflow_dispatch                        -> build AND push.
#     Releasing is manual on purpose. singleuser.image.tag in
#     lrose-jhub-values.yaml pins an exact tag, and ArgoCD syncs it onto the
#     cluster, so silently overwriting an existing tag would change what runs
#     in production without any commit to show for it.

on:
  push:
    branches: [main]
    paths:
      - 'container/**'
      - '.github/workflows/build-container.yml'
  pull_request:
    paths:
      - 'container/**'
      - '.github/workflows/build-container.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag. Leave blank to derive from LROSE_RELEASE in the Dockerfile.'
        required: false
        type: string
      push:
        description: 'Push to the registry (unchecked = build only)'
        required: false
        default: false
        type: boolean
      overwrite:
        description: 'Allow overwriting a tag that already exists in the registry'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: hub.k8s.ucar.edu
  IMAGE: hub.k8s.ucar.edu/docker/nsflrose/gateway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image carries LROSE, a full conda stack and an XFCE desktop, which
      # does not comfortably fit in the ~14 GB a stock hosted runner leaves free.
      - name: Reclaim runner disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      # Tag convention is the LROSE release date, which is already encoded in
      # the Dockerfile. Deriving it means the two cannot drift apart.
      - name: Determine tag
        id: meta
        run: |
          set -euo pipefail
          derived=$(sed -n 's/.*LROSE_RELEASE="lrose-core-\([0-9]\{8\}\)".*/\1/p' container/Dockerfile)
          if [ -z "$derived" ]; then
            echo "::error::Could not parse LROSE_RELEASE from container/Dockerfile"
            exit 1
          fi
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="$derived"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Derived from Dockerfile: $derived"
          echo "Building tag:            $tag"

      - name: Decide whether to push
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build-only run; the image will not be pushed."
          fi

      - name: Log in to the registry
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # An existing tag is almost certainly the one lrose-jhub-values.yaml pins
      # and the cluster is running. Overwriting it is a production change.
      - name: Refuse to clobber an existing tag
        if: steps.gate.outputs.push == 'true' && inputs.overwrite != true
        run: |
          if docker manifest inspect "${IMAGE}:${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${{ steps.meta.outputs.tag }} already exists. Bump LROSE_RELEASE, pass a different tag, or re-run with 'overwrite' checked."
            exit 1
          fi
          echo "Tag is free."

      - uses: docker/setup-buildx-action@v3

      - name: Build${{ steps.gate.outputs.push == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile
          platforms: linux/amd64          # LROSE_TARGET_ARCH in the Dockerfile is amd64
          push: ${{ steps.gate.outputs.push == 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          pull: true
          no-cache: true                  # base image and LROSE .deb must be fresh

      - name: Summary
        run: |
          {
            echo "### ${IMAGE}:${{ steps.meta.outputs.tag }}"
            if [ "${{ steps.gate.outputs.push }}" = "true" ]; then
              echo "Pushed. To deploy, set \`singleuser.image.tag: \"${{ steps.meta.outputs.tag }}\"\` in \`lrose-jhub-values.yaml\` and let ArgoCD sync."
            else
              echo "Built only (not pushed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
